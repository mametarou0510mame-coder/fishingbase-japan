<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title>
<script>
// TikTok Studio に自前の動画を渡すための中継（www.tiktok.com の親ページにだけ送る）
(async function () {
  var f = new URLSearchParams(location.search).get("f") || "";
  if (!/^\/(sns|tiktok)\/[\w.-]+\.mp4$/.test(f)) return;
  var parentOrigin = "https://www.tiktok.com";
  try {
    var r = await fetch(f);
    var buf = await r.arrayBuffer();
    parent.postMessage({ tsuredokiRelay: true, name: f.split("/").pop(), buf: buf }, parentOrigin, [buf]);
  } catch (e) {
    parent.postMessage({ tsuredokiRelay: true, error: String(e) }, parentOrigin);
  }
})();
</script>
