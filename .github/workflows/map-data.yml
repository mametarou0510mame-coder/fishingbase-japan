name: Map data

# 地図ページのデータ（釣り場の位置・関西の海岸線）を作る。釣り場が増えた時にも自動で動く。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lib/spots.ts]

permissions:
  contents: write

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock world-atlas@2 topojson-client@3
      - run: node --experimental-strip-types --no-warnings scripts/make-map.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lib/spotCoords.json lib/kansaiMap.json
          git diff --cached --quiet && exit 0
          git commit -qm "地図データを更新"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
