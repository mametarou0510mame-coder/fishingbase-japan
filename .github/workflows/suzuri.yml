name: SUZURI goods

# SUZURI API でグッズを作る（手動実行のみ）。トークンは Secrets の SUZURI_TOKEN。
on:
  workflow_dispatch:
    inputs:
      action:
        description: "items（作れるアイテム一覧）/ create（SPEC のとおり作る）"
        required: true
        default: items
      spec:
        description: "create のときの SPEC（例 content/goods/spec-tee1.json）"
        required: false

permissions:
  contents: write

concurrency:
  group: suzuri
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          SUZURI_TOKEN: ${{ secrets.SUZURI_TOKEN }}
        run: python scripts/goods/suzuri.py ${{ github.event.inputs.action }} ${{ github.event.inputs.spec }}
      - name: Save item list
        if: github.event.inputs.action == 'items'
        run: |
          git config user.name "tsuredoki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goods/suzuri-items.json
          git commit -qm "SUZURI のアイテム一覧を更新" || exit 0
          git pull -q --rebase && git push -q
