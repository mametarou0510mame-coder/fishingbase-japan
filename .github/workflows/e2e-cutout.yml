name: E2E cutout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          python scripts/test/e2e_cutout.py
