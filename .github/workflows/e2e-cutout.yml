name: E2E cutout

on:
  workflow_dispatch:
    inputs:
      script:
        description: "scripts/test のどれを動かすか"
        default: e2e_cutout.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          python scripts/test/${{ github.event.inputs.script || 'e2e_cutout.py' }}
