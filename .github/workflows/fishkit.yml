name: Fish Kit import
# 魚・イカ・エビ・水槽の部品の3Dモデル集（CC0 1.0）を scripts/cg/vendor に取り込む
#   2026-11-12 オーナー：Fish Kit（https://cda-social.github.io/fish/gallery.html）
#   2026-11-20 オーナー：新しいモデル集（https://cda-social.github.io/aquarium/models-gallery.html）に入れ替え。種類が増えた
#     海水魚 → vendor/fishkit、イカ・エビ → vendor/squidkit（squid-kit.js と shrimp-kit.js）、淡水魚 → vendor/freshkit、オブジェクト（砂・石・水草）→ vendor/objectskit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          set -e
          B=https://cda-social.github.io/aquarium/kit
          get() { # $1=zip の名前 $2=入れる先
            curl -fsSL -o /tmp/$1.zip "$B/$1.zip"
            rm -rf /tmp/x && mkdir -p /tmp/x && unzip -q /tmp/$1.zip -d /tmp/x
            ROOT=$(dirname "$(find /tmp/x -name README.md -maxdepth 2 | head -1)")
            rm -rf "scripts/cg/vendor/$2" && mkdir -p "scripts/cg/vendor/$2"
            cp -r "$ROOT"/. "scripts/cg/vendor/$2/"
            rm -rf "scripts/cg/vendor/$2/making"   # 作り方（Codex・Blender のスクリプト）は動画では使わない
            printf '%s（CC0 1.0）\n出典：https://cda-social.github.io/aquarium/models-gallery.html （%s）\n取り込み：%s\n' "$1" "$B/$1.zip" "$(date -u +%F)" > "scripts/cg/vendor/$2/SOURCE.txt"
            echo "== $2"; du -sh "scripts/cg/vendor/$2"; ls "scripts/cg/vendor/$2"
          }
          get saltwater-fish-kit fishkit
          get other-kit squidkit
          get freshwater-fish-kit freshkit
          get objects-kit objectskit
          find scripts/cg/vendor -size +40M
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/cg/vendor/fishkit scripts/cg/vendor/squidkit scripts/cg/vendor/freshkit scripts/cg/vendor/objectskit
          git commit -m "3Dモデル集（CC0）を新しいもの（aquarium）に入れ替え" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
