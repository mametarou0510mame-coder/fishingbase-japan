name: Aquarium kit probe
# 新しい3Dモデル集（https://cda-social.github.io/aquarium/models-gallery.html、CC0 1.0）の中身を調べる（2026-11-20 オーナー指示：前のモデルと入れ替え）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: page
        run: |
          B=https://cda-social.github.io/aquarium
          curl -fsSL "$B/assets/modelsGallery-B8sXRfto.js" -o g.js; wc -c g.js
          echo "=== zip/kit"; grep -oE '.{0,160}\.zip.{0,200}' g.js | head -20
          echo "=== kit dirs"; grep -oE '"[a-zA-Z0-9_./-]*(kit|Kit)[a-zA-Z0-9_./-]*"' g.js | sort -u | head -40
          echo "=== ids"; grep -oE '\{id:"[a-z0-9_-]+",[^}]{0,120}' g.js | head -150
          for z in $(grep -oE '"[^"]*\.zip"' g.js | tr -d '"' | sort -u); do u=$z; case $z in http*) ;; /*) u="https://cda-social.github.io$z";; *) u="$B/${z#./}";; esac; echo "=== ZIP $u"; curl -fsSL -o k.zip "$u" && ls -la k.zip && unzip -l k.zip | awk '{print $1, $4}' | grep -vE "\.(png|jpg|webp|ktx2)$" | head -150; unzip -l k.zip | tail -1; done
