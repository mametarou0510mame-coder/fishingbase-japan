name: Aquarium kit probe
# 新しい3Dモデル集（https://cda-social.github.io/aquarium/models-gallery.html、CC0 1.0）の中身を調べる（2026-11-20 オーナー指示：前のモデルと入れ替え）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: page
        run: |
          B=https://cda-social.github.io/aquarium/kit
          for z in saltwater-fish-kit other-kit; do echo "=== ZIP $z"; curl -fsSL -o k.zip "$B/$z.zip" && ls -la k.zip && unzip -l k.zip | awk '{print $1, $4}' | grep -vE "\.(png|jpg|webp|ktx2)$" | head -200; unzip -l k.zip | tail -1; unzip -o -q k.zip -d $z; done
          for f in $(find . -name README.md -path "*kit*"); do echo "=== $f"; head -c 7000 $f; done
