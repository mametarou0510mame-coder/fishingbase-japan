name: Pet post（まめすけアナの日常）

# オーナーの犬の動画を投稿する。動画は public/sns/<id>.mp4・.jpg、文は content/pet/<id>.json に先に置く。
on:
  workflow_dispatch:
    inputs:
      id:
        description: "例 mame-01"
        required: true

permissions:
  contents: write

concurrency:
  group: sns-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/sns/pet_post.py ${{ github.event.inputs.id }}
      - name: Save log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/sns
          git commit -qm "まめすけ投稿ログ" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
