name: Guide videos

# 釣り方ガイドの図解アニメ動画を作る。ナレーションは VOICEVOX（ずんだもん）で合成する。
#  - 手動実行: slugs に作りたいガイド（空白区切り）。all で全部。
#  - content/guides/ のガイドを変更して push したときは、変更したガイドだけ作り直す。
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "作るガイドの slug（空白区切り。all で全部）"
        required: true
        default: all
  push:
    branches: [main]
    paths:
      - "content/guides/*.json"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide guides
        id: slugs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            S="${{ github.event.inputs.slugs }}"
          else
            S=$(git diff --name-only HEAD~1 HEAD -- 'content/guides/*.json' | xargs -r -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          fi
          if [ "$S" = "all" ]; then
            S=$(ls content/guides/*.json | xargs -n1 basename | sed 's/\.json$//' | grep -v '^_' | tr '\n' ' ')
          fi
          echo "slugs=$S" >> $GITHUB_OUTPUT
          echo "::notice::guides: $S"
      - name: Install fonts, ffmpeg, Python packages
        if: steps.slugs.outputs.slugs != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg > /dev/null
          pip install --quiet pillow numpy
      - name: Wait for VOICEVOX engine
        if: steps.slugs.outputs.slugs != ''
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:50021/version; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::VOICEVOX engine did not start"; exit 1
      - name: Narrate and render
        if: steps.slugs.outputs.slugs != ''
        run: |
          for s in ${{ steps.slugs.outputs.slugs }}; do
            python scripts/video/narrate.py "$s"
            python scripts/video/render.py "$s"
            echo "::notice::$s: $(du -h public/videos/$s.mp4 | cut -f1)"
          done
      - name: Commit videos
        if: steps.slugs.outputs.slugs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "釣り方ガイドの動画を更新: ${{ steps.slugs.outputs.slugs }}"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
