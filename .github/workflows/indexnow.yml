name: IndexNow

# サイトのページ一覧（sitemap.xml）を、IndexNow 対応の検索エンジン（Bing など）に週1回知らせる。
on:
  schedule:
    - cron: "17 1 * * 1" # 月曜 10:17 JST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
