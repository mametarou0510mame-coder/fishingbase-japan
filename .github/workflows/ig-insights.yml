name: Instagram insights (read only)

# いつ出すと見られるかを調べる：フォロワーがオンラインの時間帯・投稿ごとのリーチ。読むだけ。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/sns/ig_insights.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/sns/ig-insights.json && git commit -qm "Instagram インサイトの記録" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
