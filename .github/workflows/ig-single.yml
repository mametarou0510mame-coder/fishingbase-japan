name: Instagram single image

# オーナーが確認した1枚の画像を投稿する（content/sns/ig/<name>.jpg と .txt）
on:
  workflow_dispatch:
    inputs:
      name:
        description: "例 gyotaku-ishidai40"
        required: true

permissions:
  contents: read

concurrency:
  group: ig-images
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/sns/ig_single.py "${{ github.event.inputs.name }}"
