name: Voice samples
# VOICEVOX の声の聞きくらべ（手動）。long-media の preview/voices/ に保存する
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version >/dev/null && break; sleep 5; done
          python scripts/video/voice_samples.py
      - run: |
          git config user.name "tsuredoki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin long-media
          git worktree add /tmp/media origin/long-media && cd /tmp/media && git checkout -B long-media
          rm -rf preview/voices && mkdir -p preview/voices && cp $GITHUB_WORKSPACE/out/voices/*.wav $GITHUB_WORKSPACE/out/voices/index.json preview/voices/
          git add -A && git commit -qm "voice samples"
          for i in 1 2 3 4 5; do git push origin long-media && exit 0; sleep 15; git pull --rebase origin long-media; done; exit 1
