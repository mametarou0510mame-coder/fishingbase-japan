name: Share reel (preview)

# 「釣り仲間に送って」版のサイト紹介リールを、ナレーション付きで作る。
# 確認用に long-media の preview/ へ保存するだけで、投稿はしない。
on:
  push:
    branches: [reel-share-voice]
    paths: [scripts/sns/share_reel.py, .github/workflows/share-reel.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg > /dev/null
          pip install --quiet pillow numpy
      - name: Make
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version >/dev/null && break; sleep 5; done
          python scripts/sns/share_reel.py . /tmp/share-reel.mp4 --voice
          ffmpeg -y -loglevel error -ss 1 -i /tmp/share-reel.mp4 -frames:v 1 -q:v 2 /tmp/share-reel.jpg
      - name: Save preview
        run: |
          git config user.name "tsuredoki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin long-media
          git worktree add /tmp/media origin/long-media && cd /tmp/media && git checkout -B long-media
          mkdir -p preview && cp /tmp/share-reel.mp4 /tmp/share-reel.jpg preview/
          git add -A && git commit -qm "share reel preview"
          for i in 1 2 3 4 5; do git push origin long-media && exit 0; sleep 15; git pull --rebase origin long-media; done; exit 1
