name: Long video upload

# long-media ブランチに保存した長尺動画を、1日1本 YouTube に投稿する（18時台。出せなかった日は21時台にもう一度試す）。
# 2026-11-09 オーナー：長尺は1日1本、高クオリティのものを出す（07:17 の回はやめた）。
# 2026-11-27 オーナー：通常の長尺（long-*）は毎日2本。cg-* とは別の枠で 12:17 と 20:17（出せなかった分は 23:17）。
# 全部投稿し終わったら何もしない。キューは yt_long.py の ORDER（long-* は APPROVED にあるものだけ）。
on:
  schedule:
    - cron: "17 9 * * *" # 18:17 JST
    - cron: "17 12 * * *" # 21:17 JST（18時に出せなかった日だけ）
    - cron: "17 3 * * *" # 12:17 JST long-* の1本目
    - cron: "17 11 * * *" # 20:17 JST long-* の2本目
    - cron: "17 14 * * *" # 23:17 JST long-*（2本出せなかった日だけ）
  workflow_dispatch:
    inputs:
      force:
        description: "今日すでに投稿していても、もう1本出す（true）"
        required: false
        default: "false"
      slug:
        description: "この動画を出す（空なら列の次。道具紹介など時刻を決めて出すとき）"
        required: false
        default: ""
      publish_at:
        description: "予約公開の時刻（例 2026-11-28T06:00:00+09:00）。入れると非公開で上げて、この時刻に公開される。公開までに Studio で収益化をオンにする"
        required: false
        default: ""
      track:
        description: "列の次を選ぶとき：cg（3DCG・アカデミー）/ long（オーナー OK の long-*）"
        required: false
        default: "cg"

permissions:
  contents: write
  actions: write # 3DCG の長尺を出したあと、ショート（cg-short.yml）を起動するため

concurrency:
  group: long-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload next
        id: up
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PUBLISH_AT: ${{ github.event.inputs.publish_at }}
        run: |
          set -o pipefail
          trap 'echo "::error::失敗した行: $BASH_COMMAND"' ERR
          F=""; [ "${{ github.event.inputs.force }}" = "true" ] && F="--force"
          # 続けて起動されたときに同じ動画を2回出さないよう、直前の投稿記録を取りこんでから選ぶ
          sleep 20; git pull -q origin main || true
          S="${{ github.event.inputs.slug }}"
          if [ -n "$S" ]; then
            python -c "import json,sys;sys.exit(0 if sys.argv[1] not in json.load(open('data/sns/long-posts.json')) else 1)" "$S" || { echo "::notice::$S は投稿済みです"; exit 0; }
          else
            N=next
            case "${{ github.event.schedule }}" in "17 3 * * *"|"17 11 * * *"|"17 14 * * *") N=next-long ;; esac
            [ "${{ github.event.inputs.track }}" = "long" ] && N=next-long
            S=$(python scripts/sns/yt_long.py $N $F)
          fi
          [ -z "$S" ] && echo "::notice::長尺動画はすべて投稿済みです" && exit 0
          git fetch -q --depth 1 origin +long-media:refs/remotes/origin/long-media
          mkdir -p out
          for f in "$S.jpg" "$S-chapters.txt"; do git show "origin/long-media:$f" > "out/$f"; done
          # 100MB を超える動画は分割して保存してある（$S.mp4.part-00, -01 …）
          if git cat-file -e "origin/long-media:$S.mp4" 2>/dev/null; then
            git show "origin/long-media:$S.mp4" > "out/$S.mp4"
          else
            : > "out/$S.mp4"
            for p in $(git ls-tree --name-only origin/long-media | grep "^$S.mp4.part-" | sort); do git show "origin/long-media:$p" >> "out/$S.mp4"; done
          fi
          [ -s "out/$S.mp4" ] || { echo "::error::動画がありません: $S"; exit 1; }
          python scripts/sns/yt_long.py "$S" "out/$S.mp4" "out/$S.jpg" "out/$S-chapters.txt" --publish 2>&1 | tee /tmp/up.log || { echo "::error::$(tail -c 600 /tmp/up.log | tr '\n' ' ')"; exit 1; }
          echo "slug=$S" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/sns/long-posts.json data/sns/yt-comments 2>/dev/null; git commit -qm "長尺動画の投稿記録: $S" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
      - name: Post the CG short
        # 2026-11-17 オーナー：長尺は 3DCG・アカデミーで毎日1本。長尺が出たら、そのショート版（content/cg/short-<slug>.json）を続けて出す。
        # すでに出したショート（reels-log.json に同じ key）は出さない。
        if: steps.up.outputs.slug != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S="${{ steps.up.outputs.slug }}"; SH="short-$S"
          case "$S" in cg-*) ;; *) exit 0 ;; esac
          [ -f "content/cg/$SH.json" ] || { echo "::notice::$SH はありません"; exit 0; }
          git pull -q origin main || true
          python3 -c "import json,sys;sys.exit(1 if any(p.get('key')==sys.argv[1] for p in json.load(open('data/sns/reels-log.json'))['posts']) else 0)" "$SH" || { echo "::notice::$SH は投稿済みです"; exit 0; }
          gh workflow run cg-short.yml --repo "${{ github.repository }}" -f slugs="$SH" -f publish=true
          echo "::notice::$SH の投稿を起動しました"
